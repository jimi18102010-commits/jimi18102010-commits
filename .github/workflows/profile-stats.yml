name: Profile statistics
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - generate_cards.py
      - tests/test_profile_stats.py
      - .github/workflows/profile-stats.yml
  pull_request:
    paths:
      - generate_cards.py
      - tests/test_profile_stats.py
      - .github/workflows/profile-stats.yml
permissions:
  contents: read
concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  refresh:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: Commit sourced snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md profile-stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh sourced public profile statistics'
            git push
          fi
