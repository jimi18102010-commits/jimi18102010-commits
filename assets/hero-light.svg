<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">Jimmiy — Systems &amp; Low-Latency Developer</title>
  <desc id="hero-light-desc">GitHub profile header for Jimmiy, based in Uzbekistan, focused on Rust, C, eBPF/XDP, and Linux systems tooling.</desc>
  <defs>
    <pattern id="dot-grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#eaeef2" />
    </pattern>
    <linearGradient id="accent-fade-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0969da" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="899" height="219" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect x="0" y="0" width="900" height="220" fill="#ffffff" />
    <rect x="520" y="0" width="380" height="220" fill="url(#dot-grid-light)" />
    <rect x="0" y="0" width="900" height="2" fill="url(#accent-fade-light)" />
  </g>
  <rect x="0.5" y="0.5" width="899" height="219" rx="12" fill="none" stroke="#d0d7de" />

  <!-- Left column: Identity & Focus -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="28" y="34" width="4" height="20" rx="2" fill="#0969da" />
    <text x="42" y="49" fill="#57606a" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2">UZBEKISTAN  //  SYSTEMS &amp; LOW-LATENCY</text>

    <text x="28" y="100" fill="#1f2328" font-size="42" font-weight="700" letter-spacing="-0.5">Jimmiy</text>
    <text x="28" y="131" fill="#57606a" font-size="14.5" font-weight="400">Linux kernel internals, eBPF/XDP, Rust tooling &amp; zero-bloat engineering.</text>

    <!-- Focus pills -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600">
      <rect x="28" y="156" width="112" height="26" rx="6" fill="#f6f8fa" stroke="#bc4c00" stroke-opacity="0.45" />
      <circle cx="43" cy="169" r="3.5" fill="#bc4c00" />
      <text x="54" y="173" fill="#1f2328">Rust · egui</text>

      <rect x="150" y="156" width="136" height="26" rx="6" fill="#f6f8fa" stroke="#1a7f37" stroke-opacity="0.45" />
      <circle cx="165" cy="169" r="3.5" fill="#1a7f37" />
      <text x="176" y="173" fill="#1f2328">C · eBPF / XDP</text>

      <rect x="296" y="156" width="174" height="26" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-opacity="0.45" />
      <circle cx="311" cy="169" r="3.5" fill="#0969da" />
      <text x="322" y="173" fill="#1f2328">Python · Systems CLI</text>
    </g>
  </g>

  <!-- Right column: Minimalist telemetry window -->
  <g>
    <rect x="600" y="32" width="272" height="156" rx="10" fill="#f6f8fa" stroke="#d0d7de" />
    <line x1="600" y1="62" x2="872" y2="62" stroke="#d0d7de" />
    <circle cx="618" cy="47" r="3.5" fill="#6e7681" opacity="0.55" />
    <circle cx="630" cy="47" r="3.5" fill="#6e7681" opacity="0.55" />
    <circle cx="642" cy="47" r="3.5" fill="#6e7681" opacity="0.55" />
    <text x="658" y="51" fill="#57606a" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5">~/profile.env</text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
      <text x="618" y="88" fill="#6e7681">AGE</text>
      <text x="698" y="88" fill="#1a7f37" font-weight="600">15 y.o.</text>

      <text x="618" y="113" fill="#6e7681">BASE</text>
      <text x="698" y="113" fill="#1f2328">Uzbekistan</text>

      <text x="618" y="138" fill="#6e7681">FOCUS</text>
      <text x="698" y="138" fill="#1f2328">Rust · C · Linux</text>

      <text x="618" y="163" fill="#6e7681">UPSTREAM</text>
      <text x="698" y="163" fill="#0969da">gdown · scapy</text>
    </g>
  </g>
</svg>
