<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">Jimmy — Systems &amp; Low-Latency Developer</title>
  <desc id="hero-dark-desc">GitHub profile header for Jimmy, based in Uzbekistan, focused on Rust, C, eBPF/XDP, and Linux systems tooling.</desc>
  <defs>
    <pattern id="dot-grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d" />
    </pattern>
    <linearGradient id="accent-fade-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card-clip-dark">
      <rect x="0.5" y="0.5" width="899" height="219" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <rect x="0" y="0" width="900" height="220" fill="#0d1117" />
    <rect x="520" y="0" width="380" height="220" fill="url(#dot-grid-dark)" />
    <rect x="0" y="0" width="900" height="2" fill="url(#accent-fade-dark)" />
  </g>
  <rect x="0.5" y="0.5" width="899" height="219" rx="12" fill="none" stroke="#30363d" />

  <!-- Left column: Identity & Focus -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="28" y="34" width="4" height="20" rx="2" fill="#58a6ff" />
    <text x="42" y="49" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2">UZBEKISTAN  //  SYSTEMS &amp; LOW-LATENCY</text>

    <text x="28" y="100" fill="#f0f6fc" font-size="42" font-weight="700" letter-spacing="-0.5">Jimmy</text>
    <text x="28" y="131" fill="#8b949e" font-size="14.5" font-weight="400">Linux kernel internals, eBPF/XDP, Rust tooling &amp; zero-bloat engineering.</text>

    <!-- Focus pills -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600">
      <rect x="28" y="156" width="112" height="26" rx="6" fill="#161b22" stroke="#e08256" stroke-opacity="0.55" />
      <circle cx="43" cy="169" r="3.5" fill="#e08256" />
      <text x="54" y="173" fill="#f0f6fc">Rust · egui</text>

      <rect x="150" y="156" width="136" height="26" rx="6" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55" />
      <circle cx="165" cy="169" r="3.5" fill="#3fb950" />
      <text x="176" y="173" fill="#f0f6fc">C · eBPF / XDP</text>

      <rect x="296" y="156" width="174" height="26" rx="6" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.55" />
      <circle cx="311" cy="169" r="3.5" fill="#58a6ff" />
      <text x="322" y="173" fill="#f0f6fc">Python · Systems CLI</text>
    </g>
  </g>

  <!-- Right column: Minimalist telemetry window -->
  <g>
    <rect x="600" y="32" width="272" height="156" rx="10" fill="#161b22" stroke="#30363d" />
    <line x1="600" y1="62" x2="872" y2="62" stroke="#30363d" />
    <circle cx="618" cy="47" r="3.5" fill="#6e7681" opacity="0.6" />
    <circle cx="630" cy="47" r="3.5" fill="#6e7681" opacity="0.6" />
    <circle cx="642" cy="47" r="3.5" fill="#6e7681" opacity="0.6" />
    <text x="658" y="51" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5">~/profile.env</text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
      <text x="618" y="88" fill="#6e7681">AGE</text>
      <text x="698" y="88" fill="#3fb950" font-weight="600">16 y.o.</text>

      <text x="618" y="113" fill="#6e7681">BASE</text>
      <text x="698" y="113" fill="#f0f6fc">Uzbekistan</text>

      <text x="618" y="138" fill="#6e7681">FOCUS</text>
      <text x="698" y="138" fill="#f0f6fc">Rust · C · Linux</text>

      <text x="618" y="163" fill="#6e7681">UPSTREAM</text>
      <text x="698" y="163" fill="#58a6ff">gdown · scapy</text>
    </g>
  </g>
</svg>
