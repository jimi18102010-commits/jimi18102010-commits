<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="290">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <style>
    .term-bg { fill: #070a0e; stroke: #1e2632; stroke-width: 1.2px; }
    .term-header { fill: url(#headerGrad); stroke: #1e2632; stroke-width: 1px; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace; font-size: 12px; fill: #7d8590; font-weight: 500; text-anchor: middle; }
    .code { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace; font-size: 12px; }
    .prompt { fill: #7ee787; font-weight: 600; }
    .path { fill: #79c0ff; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-weight: 500; }
    .dim { fill: #6e7681; }
    .cyan { fill: #56d4dd; }
    .green { fill: #3fb950; }
    .yellow { fill: #e3b341; }
    .red { fill: #ff7b72; }
    .purple { fill: #d2a8ff; }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Background -->
  <rect x="5" y="5" width="870" height="280" rx="10" ry="10" class="term-bg" />

  <!-- Header -->
  <path d="M 5 15 Q 5 5 15 5 L 865 5 Q 875 5 875 15 L 875 38 L 5 38 Z" class="term-header" />
  <circle cx="25" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="59" cy="22" r="5" fill="#27c93f"/>
  <text x="440" y="26" class="text-title">jimmiy@cachyos-x86_64: ~/systems</text>

  <!-- Commands -->
  <g class="code">
    <!-- Line 1: Identity & Age -->
    <text x="25" y="68">
      <tspan class="prompt">jimmiy@cachyos</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan>
      <tspan class="cmd"> sysctl -a | grep -E 'developer.identity'</tspan>
    </text>
    <text x="25" y="90">
      <tspan class="dim">↳</tspan> <tspan class="cyan">developer.age</tspan> <tspan class="dim">=</tspan> <tspan class="purple">15</tspan>
      <tspan class="dim"> | </tspan> <tspan class="cyan">developer.location</tspan> <tspan class="dim">=</tspan> <tspan class="green">"Uzbekistan"</tspan>
      <tspan class="dim"> | </tspan> <tspan class="cyan">core.focus</tspan> <tspan class="dim">=</tspan> <tspan class="yellow">"eBPF, Low-Latency Networking, L4/L7 Shields"</tspan>
    </text>

    <!-- Line 2: VORTEX Status -->
    <text x="25" y="128">
      <tspan class="prompt">jimmiy@cachyos</tspan><tspan class="dim">:</tspan><tspan class="path">~/vortex</tspan><tspan class="dim">$</tspan>
      <tspan class="cmd"> ./vortex --kernel-status --wire-metrics</tspan>
    </text>
    <text x="25" y="150">
      <tspan class="green">[OK]</tspan> <tspan class="cmd">L4 eBPF/XDP Shield :</tspan> <tspan class="purple">BPF_MAP_TYPE_LRU_HASH</tspan> <tspan class="dim">→</tspan> <tspan class="red">12,400,000 PPS</tspan> <tspan class="dim">wire-speed drop</tspan>
    </text>
    <text x="25" y="170">
      <tspan class="green">[OK]</tspan> <tspan class="cmd">L7 Threat Radar    :</tspan> <tspan class="cyan">JA3 (MD5) &amp; JA4 (Alphanumeric)</tspan> <tspan class="dim">raw TLS ClientHello sniffer</tspan>
    </text>

    <!-- Line 3: Upstream Git Contributions -->
    <text x="25" y="208">
      <tspan class="prompt">jimmiy@cachyos</tspan><tspan class="dim">:</tspan><tspan class="path">~/upstream</tspan><tspan class="dim">$</tspan>
      <tspan class="cmd"> gh pr list --state=all --author=jimi18102010-commits</tspan>
    </text>
    <text x="25" y="230">
      <tspan class="green">✔ MERGED </tspan> <tspan class="cmd">wkentaro/gdown#532</tspan> <tspan class="yellow">[5.5k ⭐]</tspan> <tspan class="dim">Multiform RFC &amp; Raw Direct Download Fix</tspan>
    </text>
    <text x="25" y="250">
      <tspan class="yellow">⚡ ACTIVE </tspan> <tspan class="cmd">secdev/scapy#5207 </tspan> <tspan class="yellow">[11.5k ⭐]</tspan> <tspan class="dim">IPv6 Segment Routing Header Truncation Crash Fix</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>
</svg>
