<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e27"/>
      <stop offset="100%" stop-color="#0e141c"/>
    </linearGradient>

    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1115"/>
      <stop offset="100%" stop-color="#1f090b"/>
    </linearGradient>

    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1b"/>
      <stop offset="100%" stop-color="#07170e"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #1e2631; stroke-width: 1.2px; }
    .card { fill: url(#cardGrad); stroke: #2a3644; stroke-width: 1px; rx: 8px; }
    .card-drop { fill: url(#dropGrad); stroke: #f85149; stroke-width: 1.2px; stroke-dasharray: 4,4; rx: 8px; }
    .card-pass { fill: url(#passGrad); stroke: #2ea043; stroke-width: 1.2px; rx: 8px; }
    
    .font-mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    
    .title { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .subtitle { font-size: 10px; font-weight: 500; fill: #8b949e; }
    .tag { font-size: 9px; font-weight: 600; }
    
    /* Animated packet flow */
    .wire { stroke: #263342; stroke-width: 2px; fill: none; }
    .wire-active-cyan {
      stroke: #58a6ff;
      stroke-width: 2px;
      stroke-dasharray: 6, 12;
      animation: flow 1.5s linear infinite;
      fill: none;
    }
    .wire-active-red {
      stroke: #ff7b72;
      stroke-width: 2px;
      stroke-dasharray: 6, 10;
      animation: flow 1.2s linear infinite;
      fill: none;
    }
    .wire-active-green {
      stroke: #3fb950;
      stroke-width: 2px;
      stroke-dasharray: 6, 12;
      animation: flow 1.5s linear infinite;
      fill: none;
    }

    @keyframes flow {
      from { stroke-dashoffset: 36; }
      to { stroke-dashoffset: 0; }
    }

    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>

  <!-- Container -->
  <rect x="5" y="5" width="870" height="330" rx="12" class="bg" />

  <!-- Diagram Title / Header -->
  <text x="30" y="32" class="font-sans title" style="letter-spacing: 0.5px;">⚡ VORTEX LOW-LATENCY EDGE DEFENSE PIPELINE</text>
  <text x="540" y="32" class="font-mono subtitle">ARCHITECTURE :: ZERO-COPY KERNEL HOOK</text>
  <line x1="30" y1="42" x2="850" y2="42" stroke="#1e2631" stroke-width="1"/>

  <!-- WIRES (Underneath Cards) -->
  <!-- Ingress -> XDP Hook -->
  <path d="M 180 170 L 250 170" class="wire" />
  <path d="M 180 170 L 250 170" class="wire-active-cyan" />

  <!-- XDP Hook -> DROP (Top branch) -->
  <path d="M 430 145 L 470 145 L 470 105 L 530 105" class="wire" />
  <path d="M 430 145 L 470 145 L 470 105 L 530 105" class="wire-active-red" filter="url(#glow-red)" />

  <!-- XDP Hook -> PASS (Bottom branch) -->
  <path d="M 430 195 L 470 195 L 470 235 L 530 235" class="wire" />
  <path d="M 430 195 L 470 195 L 470 235 L 530 235" class="wire-active-green" filter="url(#glow-green)" />

  <!-- PASS -> UPSTREAM -->
  <path d="M 710 235 L 750 235" class="wire" />
  <path d="M 710 235 L 750 235" class="wire-active-cyan" />

  <!-- 1. INCOMING INGRESS CARD -->
  <g transform="translate(30, 115)">
    <rect width="150" height="110" class="card" />
    <circle cx="20" cy="24" r="4" fill="#58a6ff" filter="url(#glow-cyan)" />
    <text x="32" y="28" class="font-mono title" style="font-size: 11px;">INGRESS TRAFFIC</text>
    <text x="16" y="52" class="font-mono subtitle">NIC Driver RX</text>
    <text x="16" y="70" class="font-mono" style="fill: #79c0ff; font-size: 10px;">10GbE / 100GbE Wire</text>
    <text x="16" y="88" class="font-mono" style="fill: #8b949e; font-size: 9px;">• SYN / UDP Floods</text>
    <text x="16" y="100" class="font-mono" style="fill: #8b949e; font-size: 9px;">• Legitimate TLS</text>
  </g>

  <!-- 2. eBPF / XDP KERNEL HOOK -->
  <g transform="translate(250, 100)">
    <rect width="180" height="140" class="card" style="stroke: #58a6ff; stroke-width: 1.5px;" />
    <circle cx="20" cy="24" r="5" fill="#3fb950" filter="url(#glow-green)" />
    <text x="34" y="28" class="font-mono title" style="font-size: 11px;">eBPF / XDP SHIELD</text>
    <text x="16" y="50" class="font-mono subtitle">Driver Level Hook</text>

    <!-- Map Info Box -->
    <rect x="14" y="60" width="152" height="42" rx="4" fill="#090d13" stroke="#21262d" />
    <text x="22" y="76" class="font-mono" style="fill: #d2a8ff; font-size: 9px;">BPF_MAP_LRU_HASH</text>
    <text x="22" y="92" class="font-mono" style="fill: #7ee787; font-size: 9.5px;">O(1) Kernel Lookup</text>

    <text x="16" y="122" class="font-mono" style="fill: #8b949e; font-size: 9px;">Pre-sk_buff Allocation</text>
  </g>

  <!-- 3. DROP ZONE (TOP BRANCH) -->
  <g transform="translate(530, 60)">
    <rect width="180" height="90" class="card-drop" />
    <circle cx="20" cy="22" r="4" fill="#ff7b72" filter="url(#glow-red)" />
    <text x="32" y="26" class="font-mono title" style="font-size: 11px; fill: #ff7b72;">XDP_DROP (WIRE)</text>
    <text x="16" y="48" class="font-mono" style="fill: #f85149; font-weight: 700; font-size: 12px;">&gt; 12,400,000 PPS</text>
    <text x="16" y="66" class="font-mono" style="fill: #ff7b72; font-size: 9.5px;">Zero CPU overhead</text>
    <text x="16" y="80" class="font-mono subtitle">Discards flood before RAM</text>
  </g>

  <!-- 4. L7 RADAR & PASS (BOTTOM BRANCH) -->
  <g transform="translate(530, 190)">
    <rect width="180" height="90" class="card-pass" />
    <circle cx="20" cy="22" r="4" fill="#2ea043" filter="url(#glow-green)" />
    <text x="32" y="26" class="font-mono title" style="font-size: 11px; fill: #7ee787;">L7 THREAT RADAR</text>
    <text x="16" y="48" class="font-mono" style="fill: #56d4dd; font-size: 10px;">JA3 &amp; JA4 Fingerprint</text>
    <text x="16" y="65" class="font-mono subtitle">Raw ClientHello wire sniff</text>
    <text x="16" y="79" class="font-mono" style="fill: #8b949e; font-size: 9px;">Bot / Scanner Detection</text>
  </g>

  <!-- 5. UPSTREAM SERVICE -->
  <g transform="translate(750, 190)">
    <rect width="100" height="90" class="card" style="stroke: #388bfd;" />
    <text x="14" y="26" class="font-mono title" style="font-size: 10.5px;">UPSTREAM</text>
    <text x="14" y="48" class="font-mono subtitle">Async Stream</text>
    <text x="14" y="65" class="font-mono" style="fill: #7ee787; font-size: 9.5px;">Zero-Copy</text>
    <text x="14" y="80" class="font-mono subtitle">Protected 🛡️</text>
  </g>
</svg>
